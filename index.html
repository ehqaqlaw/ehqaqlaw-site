<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إحقاق للمحاماة والاستشارات القانونية | الموقع تحت الإنشاء</title>
  <meta name="description" content="موقع شركة إحقاق للمحاماة والاستشارات القانونية تحت الإنشاء.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#14222B">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <style>
    :root{--navy:#14222B;--ivory:#F6F2E9;--gold:#C4B48C;--on-navy:#C9D1D5;--on-navy-2:#A9B4BA}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{font-family:"IBM Plex Sans Arabic","Tajawal","SF Arabic","Segoe UI",Tahoma,sans-serif;background:var(--navy);color:var(--ivory);line-height:1.8;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 20px}
    .card{width:100%;max-width:520px;text-align:center}
    .logo{width:auto;height:clamp(170px,26vw,220px);display:block;margin:0 auto 28px}
    .sub{margin:0;font-size:clamp(20px,3.4vw,26px);color:var(--gold);font-weight:500;line-height:1.5}
    .en{margin:12px 0 0;font-size:12px;letter-spacing:.26em;color:var(--on-navy-2);direction:ltr;unicode-bidi:isolate}
    .rule{width:64px;height:1px;background:var(--gold);margin:32px auto;opacity:.8}
    .msg{margin:0;font-size:clamp(16px,2.4vw,18px);color:var(--on-navy);font-weight:300}
    footer{padding:20px;text-align:center;font-size:13px;color:var(--on-navy-2)}
  </style>
</head>
<body>
<main>
  <div class="card">
    <img class="logo" src="assets/img/logo-gold.png" alt="شعار إحقاق" width="99" height="220">
    <p class="sub">للمحاماة والاستشارات القانونية</p>
    <p class="en">EHQAQ · LAW &amp; LEGAL CONSULTATIONS</p>
    <div class="rule" aria-hidden="true"></div>
    <p class="msg">موقعنا تحت الإنشاء، وسيُطلق قريباً.</p>
  </div>
</main>
<footer>© 2026 شركة إحقاق للمحاماة والاستشارات القانونية. جميع الحقوق محفوظة.</footer>
</body>
</html>
