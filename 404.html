<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الصفحة غير موجودة | إحقاق للمحاماة والاستشارات القانونية</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#14222B">
  <link rel="icon" href="/assets/img/favicon.png" type="image/png">
  <style>
    :root{--navy:#14222B;--ivory:#F6F2E9;--gold:#C4B48C;--on-navy:#C9D1D5;--on-navy-2:#A9B4BA}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{font-family:"IBM Plex Sans Arabic","Tajawal","SF Arabic","Segoe UI",Tahoma,sans-serif;background:var(--navy);color:var(--ivory);line-height:1.8;display:flex;flex-direction:column;min-height:100vh}
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 20px}
    .card{width:100%;max-width:520px;text-align:center}
    .logo{height:110px;width:auto;display:block;margin:0 auto 22px}
    .eyebrow{font-size:13px;letter-spacing:.2em;color:var(--gold)}
    h1{font-family:"Tajawal","IBM Plex Sans Arabic","SF Arabic","Segoe UI",Tahoma,sans-serif;font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.3;margin:8px 0 0}
    p{margin:14px 0 0;color:var(--on-navy);font-weight:300}
    .btn{display:inline-block;margin-top:28px;padding:13px 34px;border-radius:6px;border:1px solid var(--gold);background:var(--gold);color:var(--navy);font-weight:600;text-decoration:none}
    .btn:hover{background:transparent;color:var(--gold)}
    footer{padding:20px;text-align:center;font-size:13px;color:var(--on-navy-2)}
  </style>
</head>
<body>
<main>
  <div class="card">
    <img class="logo" src="/assets/img/logo-gold.png" alt="شعار إحقاق" width="49" height="110">
    <div class="eyebrow">٤٠٤</div>
    <h1>هذه الصفحة غير موجودة</h1>
    <p>موقعنا تحت الإنشاء، وسيُطلق قريباً.</p>
    <a class="btn" href="/">الصفحة الرئيسية</a>
  </div>
</main>
<footer>© 2026 شركة إحقاق للمحاماة والاستشارات القانونية. جميع الحقوق محفوظة.</footer>
</body>
</html>
